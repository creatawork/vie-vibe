name: deploy

on:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 测试与打包
        working-directory: server
        run: mvn -B verify

      - name: 上传 jar 到临时文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server/target/server.jar"
          target: /opt/vie/app/deploy
          strip_components: 2

      - name: 重建并滚动更新 app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/vie/app/deploy
            docker compose up -d --build app

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 构建静态站
        working-directory: site
        run: |
          npm ci
          npm run check:content
          npm run build

      - name: 上传产物到临时目录
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "site/.vitepress/dist/*"
          target: /opt/vie/app/deploy/site-dist-new
          strip_components: 3

      - name: 原子切换站点目录
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/vie/app/deploy
            rm -rf site-dist-old
            [ -d site-dist ] && mv site-dist site-dist-old || true
            mv site-dist-new site-dist
            # bind mount 钉在旧 inode，必须 recreate 才能看到新目录
            docker compose up -d --force-recreate caddy

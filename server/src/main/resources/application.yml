server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vie}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:vie}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

app:
  stats-key: ${STATS_KEY:change-me}
  ip-secret: ${IP_SECRET:change-me-too}
